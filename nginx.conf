#-----------------------------------------------------------------
# Main nginx configuration
#-----------------------------------------------------------------

worker_processes auto;


events {
    # Maximum number of simultaneous connections
    worker_connections 1024;  
}

http {

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    #----------------------------
    # Logging
    #----------------------------
    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/nginx_access.log main buffer=16k flush=5s;
    error_log   /var/log/nginx/nginx_error.log warn;
    
    #----------------------------
    # Performance tweaks
    #----------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    server_tokens       off;

    #----------------------------
    # gzip compression
    #----------------------------
    gzip                on;
    gzip_disable        "msie6";
    gzip_vary           on;
    gzip_proxied        any;
    gzip_comp_level     6;
    gzip_buffers        16 8k;
    gzip_http_version   1.1;
    gzip_types          text/css
                        text/javascript
                        text/plain
                        text/xml
                        application/javascript
                        application/json
                        application/xml
                        application/xml+rss
                        image/svg+xml
                        font/woff2;

    #----------------------------
    # WebSocket support
    #----------------------------
    map $http_upgrade $connection_upgrade {
        default   upgrade;
        ''        close;
    }

    #================================================================
    # 1) HTTP-to-HTTPS redirect for the webapp
    #================================================================
    server {
        listen  80 default_server;

        return 301  https://$host$request_uri;
    }

    #================================================================
    # 2) HTTPS server block for the webapp
    #================================================================
    server {
        listen  443 ssl default_server;
        http2   on;

        # TLS certificates
        ssl_certificate      /etc/ssl/certs/nginx.crt;
        ssl_certificate_key  /etc/ssl/private/nginx.key;

        # TLS hardening
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers          ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";

        # Ensure proxied Django cookies are only sent over HTTPS.
        proxy_cookie_flags ~ secure;
        
        # Deny hidden files
        location ~ /\. {
            deny all;
        }

        # Static assets
        location /static/ {
            alias      /app/staticfiles/;
            expires    1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location /media/ {
            alias      /app/mediafiles/;
            expires    30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # Proxy block for Elasticsearch
        location /elasticsearch/ {
            proxy_pass http://elasticsearch:9200/;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 100M;
            proxy_buffering off;
        }

        # Proxy block for Kibana
        location /kibana/ {
            proxy_pass http://kibana:5601;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Avoid long browser timeouts if Kibana is slow to start
            proxy_connect_timeout 60s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;

            proxy_buffering off;
        }

        # Server-Sent Events stream for live alerts.
        # Keep buffering off so events reach the browser immediately.
        location /alerts/alert-stream/ {
            proxy_pass         http://web:8000;
            proxy_http_version 1.1;

            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;

            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 1h;
            add_header         X-Accel-Buffering no;
        }
        
        # Proxy all other requests to the web container
        location / {
            proxy_pass         http://web:8000;  
            proxy_http_version 1.1;

            proxy_set_header   Upgrade            $http_upgrade;
            proxy_set_header   Connection         $connection_upgrade;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;

            proxy_read_timeout 90;
        }
    }
}

input {
  file {
    id => "winlog_ndjson_drop_directory"
    path => "/usr/share/logstash/logs/*.ndjson"
    mode => "read"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/files.sincedb"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/completed-files.log"
    file_sort_by => "last_modified"
    file_sort_direction => "asc"
    codec => json
  }
}

filter {
  if "_jsonparsefailure" in [tags] {
    mutate {
      add_tag => ["parseus_winlog_rejected"]
    }
  }
}

output {
  if "parseus_winlog_rejected" in [tags] {
    file {
      id => "winlog_rejected_events"
      path => "/usr/share/logstash/data/rejected-events.ndjson"
      codec => json_lines
    }
  } else {
    elasticsearch {
      id => "winlog_elasticsearch_output"
      hosts => ["${WINLOG_ELASTICSEARCH_HOSTS:http://elasticsearch.local:9200}"]
      index => "${WINLOG_INDEX_PREFIX:winlogbeat}-%{+yyyy.MM.dd}"
    }
  }
}

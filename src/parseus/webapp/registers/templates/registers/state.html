<div id="state-container" class="flex-grow-1 overflow-hidden p-3" style="aspect-ratio: 4 / 3">
  <!-- CHART -->
  <div class="row align-items-stretch overflow-hidden h-100">
    <div class="col-12 h-100 px-2" id="state-graph-div">
      <div class="d-flex flex-column bg-body-secondary rounded border h-100">
        <div class="p-1">
          <select id="state-graph-select" class="chart-option form-select">
            <option selected>Register State Over Time</option>
            <option>Register Updates Heatmap</option>
            <option>State Transition Graph</option>
          </select>
        </div>
        <div id="state-graph-legend" class="d-flex flex-row gap-3 px-2">
          <div class="legend-item d-none">
            <div class="legend-color"></div>
            <span class="legend-text"></span>
          </div>
        </div>
        <div id="state-graph" class="chart-container flex-grow-1 w-100 overflow-hidden">
          <div class="d-flex justify-content-center align-items-center h-100 text-muted">
            Please select elastic data to load ...
          </div>
        </div>
        <div id="state-graph-loading-wheel" class="d-none flex-grow-1 w-100 overflow-hidden text-center">
          <div class="spinner-border"></div>
        </div>
        <div class="d-flex flex-row gap-3 px-2 pb-2 justify-content-end">
          <button id="reset-zoom-state-graph" class="btn btn-outline-secondary disabled">
            <i class="bi-zoom-in me-2"></i>Reset Zoom</button>
        </div>
      </div>
    </div>
  </div>
</div>

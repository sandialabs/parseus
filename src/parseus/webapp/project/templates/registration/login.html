{% extends "base.html" %} {% load static %}

{% block custom_styles %}
<style>
  .loginBox {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 350px;
    min-height: 200px;
    background: #000000;
    border-radius: 10px;
    padding: 40px;
    box-sizing: border-box;
  }

  .user {
    margin: 0 auto;
    display: block;
    margin-bottom: 20px;
  }

  .loginBox input[type="text"]:hover,
  .loginBox input[type="password"]:hover {
    color: #42f3fa;
    border: 1px solid #42f3fa;
    box-shadow: 0 0 5px rgba(0, 255, 0, 0.3), 0 0 10px rgba(0, 255, 0, 0.2),
      0 0 15px rgba(0, 255, 0, 0.1), 0 2px 0 black;
  }
</style>
{% endblock %}

{% block title %}Sign in | {{ block.super }}{% endblock %}

{% block content %}
<div class="loginBox">
  <img class="user" src="{% static 'img/parseus_logo.png' %}" height="100px" width="250px">
  <h3 style="text-align: center;">Sign in here</h3>
  <form method="post">
    {% csrf_token %}
    <div data-mdb-input-init class="form-floating mb-4">
      <input type="text" name="username" id="id_username" class="form-control">
      <label class="form-label" for="id_username">Username</label>
    </div>

    <div data-mdb-input-init class="form-floating mb-4">
      <input type="password" name="password" id="id_password" class="form-control">
      <label class="form-label" for="id_password">Password</label>
    </div>

    <input type="hidden" name="next" value="{{ request.GET.next|default:request.path }}">

    <div class="d-grid gap-2 col-6 mx-auto">
      <button id="login-button" type="submit" data-mdb-button-init data-mdb-ripple-init
        class="btn btn-primary">Login</button>
    </div>

  </form>
</div>
{% endblock %}
